<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,shrink-to-fit=no,viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eaf5f0" />
    <meta name="application-name" content="Yagodka" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yagodka" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-app-192.png" sizes="192x192" />
    <link rel="mask-icon" href="./icons/icon.svg" color="#0b0f14" />
    <title>Yagodka</title>
  </head>
  <body>
    <div id="app">
      <div class="boot" aria-live="polite">
        <div class="boot-frame">
          <img class="boot-logo" src="./icons/icon.svg" alt="" />
          <div class="boot-kicker">Corporate Messenger</div>
          <div class="boot-brand">Yagodka</div>
          <div class="boot-sub" id="boot-status">Проверяем версию клиента</div>
          <div class="boot-bar" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <style>
      body {
        margin: 0;
        background: var(--body-bg, var(--app-bg, #eaf5f0));
        color: var(--app-text, #e6edf3);
        font:
          500 16px/1.35 ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
      }
      #app {
        position: relative;
        min-height: 100dvh;
      }
      .boot {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        padding: 24px;
        text-align: left;
        background: #0d1117;
        transition: opacity 180ms ease;
        will-change: opacity;
      }
      .boot.boot-out {
        opacity: 0;
        pointer-events: none;
      }
      .boot-frame {
        width: min(360px, calc(100vw - 48px));
        display: grid;
        gap: 10px;
        padding: 24px;
        border: 1px solid rgba(230, 237, 243, 0.14);
        border-radius: 8px;
        background: #111827;
        box-shadow: 0 24px 52px rgba(0, 0, 0, 0.32);
      }
      .boot-logo {
        width: 48px;
        height: 48px;
        opacity: 0.96;
      }
      .boot-kicker {
        margin-top: 6px;
        color: #93a4b8;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }
      .boot-brand {
        color: #f8fafc;
        font-weight: 800;
        letter-spacing: 0;
        font-size: 24px;
        line-height: 1.1;
      }
      .boot-sub {
        min-height: 20px;
        color: #a8b3c4;
        font-size: 14px;
        line-height: 1.4;
      }
      .boot-bar {
        width: 100%;
        height: 3px;
        margin-top: 4px;
        border-radius: 2px;
        background: linear-gradient(90deg, #2563eb 0 34%, rgba(148, 163, 184, 0.28) 34% 100%);
        position: relative;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot {
          transition: none;
        }
      }
      @media (max-width: 420px) {
        .boot {
          padding: 16px;
        }
        .boot-frame {
          width: min(100%, calc(100vw - 32px));
          padding: 18px;
        }
      }
    </style>
    <script type="module" src="/boot.js"></script>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
